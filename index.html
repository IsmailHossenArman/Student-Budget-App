<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000" id="tc">
<title>DailySafe Budget</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%23d71921'/%3E%3C/svg%3E">
<style>
:root{--bg:#f4f4f4;--card:#fff;--tx:#000;--mu:#6b6b6b;--bd:#cfcfcf;--dot:#cdcdcd;--red:#d71921;--on:#f4f4f4;color-scheme:light}
[data-theme=dark]{--bg:#000;--card:#0b0b0b;--tx:#f4f4f4;--mu:#8a8a8a;--bd:#2e2e2e;--dot:#242424;--on:#000;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(var(--dot) 1.2px,transparent 1.5px) 0 0/14px 14px var(--bg);min-height:100vh;padding:env(safe-area-inset-top) 0 calc(112px + env(safe-area-inset-bottom));transition:background-color .25s,color .25s}
main{max-width:560px;margin:0 auto;padding:12px 16px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.mo{font-family:ui-monospace,"Roboto Mono","Courier New",monospace;letter-spacing:.3px}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 0 14px}
.top b{font-size:19px}
.top span{display:flex;gap:8px}
.ib{width:48px;height:48px;border-radius:50%;border:1.5px solid var(--tx);background:var(--card);font-size:20px;line-height:1}
.i{width:20px;height:20px;fill:currentColor;vertical-align:middle}
.card{background:var(--card);border:1.5px solid var(--tx);border-radius:24px;padding:18px}
.hero small,.card>small{font-size:13px;color:var(--mu)}
.dot{font:900 clamp(54px,19vw,84px)/1.05 ui-monospace,"Roboto Mono","Courier New",monospace;margin:8px 0 14px;word-break:break-all;-webkit-mask-image:radial-gradient(circle,#000 48%,transparent 54%);-webkit-mask-size:4px 4px;mask-image:radial-gradient(circle,#000 48%,transparent 54%);mask-size:4px 4px}
.bar{height:14px;background:repeating-linear-gradient(90deg,var(--bd) 0 6px,transparent 6px 9px)}
.bar i{display:block;height:100%;width:0;transition:width .5s;background:repeating-linear-gradient(90deg,var(--tx) 0 6px,transparent 6px 9px)}
.bad .dot{color:var(--red)}
.bad .bar i{background:repeating-linear-gradient(90deg,var(--red) 0 6px,transparent 6px 9px)}
.row{display:flex;justify-content:space-between;margin-top:10px;font-size:14px}
.note{font-size:13px;color:var(--mu);margin-top:8px}
.bad .note.r,.neg{color:var(--red)}
.vault{margin:12px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}
.vault .dot{font-size:42px;margin:4px 0;word-break:normal}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.st{border:1px solid var(--bd);background:var(--card);border-radius:18px;padding:12px 14px}
.st small{font-size:12px;color:var(--mu)}
.st b{display:block;font-size:22px;margin-top:2px;font-variant-numeric:tabular-nums}
h2{font-size:14px;margin:18px 0 8px;color:var(--mu);font-weight:600}
.li{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:6px 6px 6px 14px;margin-bottom:8px;min-height:58px}
.li>div{flex:1;min-width:0}.li small{display:block;color:var(--mu);font-size:12px}
.li b{font-size:17px;margin-right:4px}
.li button{width:44px;height:44px;border-radius:50%}
.li button:active{background:var(--bd)}
.li .x{color:var(--red)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn{min-height:52px;border-radius:26px;border:1.5px solid var(--tx);font-weight:600;padding:0 14px;background:var(--card)}
.btn.p{background:var(--tx);color:var(--on)}
.btn.d{color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.35}
.btn.sm{min-height:44px;font-size:14px}
.btn:active,.fab:active{transform:scale(.97)}
.fab{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:528px;margin:auto;height:64px;border-radius:32px;background:var(--tx);color:var(--on);border:1.5px solid var(--bg);font:700 18px ui-monospace,"Courier New",monospace;z-index:2}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.on{display:flex}
.sheet{background:var(--bg);color:var(--tx);border:1.5px solid var(--tx);border-bottom:0;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-size:20px;margin-bottom:6px}
.sheet p{font-size:13px;color:var(--mu)}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
input,select,textarea{width:100%;height:54px;border-radius:16px;border:1.5px solid var(--bd);background:var(--card);padding:0 14px;font-size:17px}
textarea{height:88px;padding:10px 14px;font-size:13px;resize:none;word-break:break-all}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
.amt{font-size:34px;height:72px;font-weight:700}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chips input{display:none}
.chips label{margin:0;text-align:center;padding:14px 4px;border-radius:26px;border:1.5px solid var(--bd);color:var(--tx);font-size:15px;background:var(--card)}
.chips input:checked+label{background:var(--tx);color:var(--on);border-color:var(--tx)}
.br{display:grid;grid-template-columns:1.6fr 1fr .6fr 44px;gap:6px;margin-bottom:6px}
.br input{height:48px;font-size:15px;padding:0 8px}
.br button{height:48px;color:var(--red);font-size:22px}
.acts{display:grid;gap:8px;margin-top:16px}.two{grid-template-columns:1fr 1fr}
.empty{color:var(--mu);text-align:center;padding:18px 0}
.sec{margin-top:18px;padding-top:14px;border-top:1px dashed var(--bd)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="pe" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L18 9.75 14.25 6 3 17.25zM20.7 7a1 1 0 0 0 0-1.4l-2.3-2.3a1 1 0 0 0-1.4 0l-1.8 1.8 3.7 3.7L20.7 7z"/></symbol><symbol id="tr" viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></symbol></svg>
<main id="app"></main>
<button class="fab" id="add">+ ADD EXPENSE</button>
<div class="modal" id="m"><div class="sheet" id="mb"></div></div>
<input type="file" id="imp" accept="application/json,.json" hidden>
<script>
(function(){
'use strict';
var K='dailysafe.v1',CAP=200,CUR='৳',CATS=['Food','Transport','Bills','Health','Shopping','Misc'];
var $=function(i){return document.getElementById(i)};
var pad=function(n){return n<10?'0'+n:''+n};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
function dn(s){var p=s.split('-');return Date.UTC(+p[0],+p[1]-1,+p[2])/864e5}
function ds(n){return new Date(n*864e5).toISOString().slice(0,10)}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function eom(){var d=new Date();return ds(Date.UTC(d.getFullYear(),d.getMonth()+1,0)/864e5)}
function fmt(n){var r=Math.round(n);return(r<0?'-':'')+CUR+Math.abs(r).toLocaleString('en-US')}
function fresh(){return{v:2,budget:0,bills:[],exp:[],tr:[],start:today().slice(0,8)+'01',end:eom(),theme:'',u:0}}
function norm(o){
  var d=Object.assign(fresh(),o);
  if(!o.start&&o.month){var p=o.month.split('-');d.start=o.month+'-01';d.end=ds(Date.UTC(+p[0],+p[1],0)/864e5)}
  d.bills=(d.bills||[]).map(function(b){b.id=b.id||uid();return b});
  d.exp=d.exp||[];d.tr=d.tr||[];d.v=2;return d;
}
var S;try{S=norm(JSON.parse(localStorage.getItem(K))||{})}catch(e){S=fresh()}
function save(keep){if(!keep)S.u=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('Storage full or blocked. Copy a sync code now.')}}
function theme(){var t=S.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);$('tc').content=t==='dark'?'#000000':'#f4f4f4'}

/* Core engine: replays the cycle day by day, so any edit recalculates everything */
function calc(){
  var tn=dn(today()),st=dn(S.start),en=Math.max(dn(S.end),st),td=Math.min(Math.max(tn,st),en);
  var P=S.budget-S.bills.reduce(function(a,b){return a+(+b.amt||0)},0);
  var sp={},tr={},tot=0;
  S.exp.forEach(function(e){var n=dn(e.d);if(n>=st&&n<=en){sp[n]=(sp[n]||0)+e.a;tot+=e.a}});
  S.tr.forEach(function(t){var n=dn(t.d);tr[n]=(tr[n]||0)+t.a});
  var a=P,v=0,i,L,ex,e,lim,s,fe,r={};
  for(i=st;i<=td;i++){
    L=en-i+1;ex=a-CAP*L;if(ex>0){v+=ex;a-=ex}
    e=Math.min(tr[i]||0,v);v-=e;
    lim=Math.max(0,Math.min(CAP,a/L));s=sp[i]||0;
    fe=Math.min(e,Math.max(0,s-lim));
    if(i===td)break;
    a-=s-fe;v+=e-fe;
  }
  var aT=a-(s-fe);
  r.limit=lim+e;r.spent=s;r.left=r.limit-s;r.vault=v;r.rem=P-tot;r.pool=P;
  r.days=tn>en?0:en-td+1;r.ended=tn>en;
  r.tmr=L>1&&!r.ended?Math.max(0,Math.min(CAP,aT/(L-1))):null;
  r.tmrLow=r.tmr!==null&&r.tmr<CAP;
  return r;
}

function render(){
  theme();var c=calc(),st=dn(S.start),en=dn(S.end);
  var pct=c.limit>0?Math.min(100,c.spent/c.limit*100):(c.spent>0?100:0),over=c.left<0;
  var h='<div class="top"><b class="mo">DailySafe</b><span><button class="ib" id="sy" aria-label="Backup and sync">⇄</button><button class="ib" id="th" aria-label="Toggle dark mode">◐</button></span></div>'+
  '<section class="card hero'+(over?' bad':'')+'"><small class="mo">TODAY\'S SAFE SPEND LIMIT</small><div class="dot">'+fmt(c.limit)+'</div>'+
  '<div class="bar"><i style="width:'+pct+'%"></i></div><div class="row mo"><span>Spent '+fmt(c.spent)+'</span><span'+(over?' class="neg"':'')+'>'+(over?'Over '+fmt(-c.left):fmt(c.left)+' left')+'</span></div>'+
  (c.ended?'<p class="note r">This cycle has ended. Edit the end date or start a new cycle.</p>':over?'<p class="note r">Overspent. Tomorrow\'s limit drops to protect your budget.</p>':'')+'</section>'+
  '<section class="card vault"><div><small class="mo">SURPLUS SAVINGS</small><div class="dot">'+fmt(c.vault)+'</div><p class="note" style="margin:0">Everything above '+CUR+CAP+'/day lands here'+(c.left>0&&!c.ended?'. Unspent '+fmt(c.left)+' joins it tomorrow':'')+'.</p></div><button class="btn sm p" id="mv"'+(c.vault<1?' disabled':'')+'>Move to spending</button></section>'+
  '<div class="grid"><div class="st"><small>Remaining balance</small><b class="mo'+(c.rem<0?' neg':'')+'">'+fmt(c.rem)+'</b></div><div class="st"><small>Days left</small><b class="mo">'+c.days+'</b></div>'+
  '<div class="st"><small>Tomorrow\'s limit</small><b class="mo'+(c.tmrLow?' neg':'')+'">'+(c.tmr===null?'-':fmt(c.tmr))+'</b></div><div class="st"><small>Unallocated budget</small><b class="mo">'+fmt(c.pool)+'</b></div></div>'+
  '<h2>Expense log</h2>';
  var list=S.exp.filter(function(e){var n=dn(e.d);return n>=st&&n<=en}).sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:b.t-a.t}).slice(0,40);
  if(!list.length)h+='<div class="empty">Nothing logged in this cycle. Tap + Add Expense.</div>';
  var td=today();
  list.forEach(function(e){h+='<div class="li"><div>'+esc(e.c)+'<small class="mo">'+(e.d===td?'Today':e.d)+'</small></div><b class="mo">'+fmt(e.a)+'</b><button data-a="ed" data-id="'+esc(e.id)+'" aria-label="Edit"><svg class="i"><use href="#pe"/></svg></button><button class="x" data-a="rm" data-id="'+esc(e.id)+'" aria-label="Delete"><svg class="i"><use href="#tr"/></svg></button></div>'});
  h+='<div class="tools"><button class="btn p" id="eb">Edit Budget &amp; Fixed Costs</button><button class="btn" id="nc">New Cycle</button><button class="btn" id="cl" style="grid-column:span 2">Clear Logs</button></div>';
  $('app').innerHTML=h;
  if(S.budget<=0&&!window._f){window._f=1;settings(true)}
}
function open(h){$('mb').innerHTML=h;$('m').classList.add('on')}
function close(){$('m').classList.remove('on')}
$('m').addEventListener('click',function(e){if(e.target===this)close()});

function expModal(id){
  var e=id?S.exp.filter(function(x){return String(x.id)===id})[0]:null;
  var ch=CATS.map(function(c,i){var on=e?e.c===c:i===0;return'<input type="radio" name="c" id="c'+i+'" value="'+c+'"'+(on?' checked':'')+'><label for="c'+i+'">'+c+'</label>'}).join('');
  open('<h3>'+(e?'Edit expense':'Add expense')+'</h3><label for="a">Amount ('+CUR+')</label><input class="amt mo" id="a" type="number" inputmode="decimal" min="0" step="any" value="'+(e?e.a:'')+'" placeholder="0"><label>Category</label><div class="chips">'+ch+'</div><label for="dt">Date</label><input id="dt" type="date" value="'+(e?e.d:today())+'"><div class="acts'+(e?' two':'')+'"><button class="btn p" id="sv">Save</button>'+(e?'<button class="btn d" id="dl">Delete</button>':'')+'<button class="btn" id="cn"'+(e?' style="grid-column:span 2"':'')+'>Cancel</button></div>');
  if(!e)setTimeout(function(){$('a').focus()},60);
  $('cn').onclick=close;
  $('sv').onclick=function(){
    var a=parseFloat($('a').value);if(!(a>0)){$('a').focus();return}
    var c=document.querySelector('input[name=c]:checked').value,d=$('dt').value||today();
    if(e){e.a=a;e.c=c;e.d=d}else S.exp.push({id:uid(),a:a,c:c,d:d,t:Date.now()});
    save();close();render();
  };
  if(e)$('dl').onclick=function(){rm(id)};
}
function rm(id){
  var e=S.exp.filter(function(x){return String(x.id)===id})[0];if(!e)return;
  if(confirm('Delete '+fmt(e.a)+' ('+e.c+', '+e.d+')?')){S.exp=S.exp.filter(function(x){return x!==e});save();close();render()}
}

function billRow(b){b=b||{};return'<div class="br"><input placeholder="Name" value="'+esc(b.name||'')+'"><input type="number" inputmode="decimal" placeholder="'+CUR+'" value="'+(b.amt||'')+'"><input type="number" inputmode="numeric" min="1" max="31" placeholder="Day" value="'+(b.day||'')+'"><button aria-label="Remove bill">×</button></div>'}
function settings(isNew,fromNC){
  var t=today(),st=fromNC?t:S.start,en=fromNC?eom():S.end;
  open('<h3>'+(fromNC?'Start new cycle':isNew?'Set up your budget':'Edit budget &amp; fixed costs')+'</h3><p>'+(fromNC?'Your past expenses stay saved; only this new cycle is counted.':'Changes recalculate everything instantly. History is kept.')+'</p>'+
  '<label for="bg">Monthly income / budget ('+CUR+')</label><input id="bg" class="mo" type="number" inputmode="decimal" min="0" value="'+(fromNC?'':S.budget||'')+'" placeholder="0">'+
  '<label for="s1">Cycle start</label><input id="s1" type="date" value="'+st+'"><label for="s2">Cycle end</label><input id="s2" type="date" value="'+en+'">'+
  '<label>Fixed costs (name, amount, due day)</label><div id="bl">'+(S.bills.length?S.bills.map(billRow).join(''):billRow())+'</div><button class="btn sm" id="ab" style="width:100%">+ Add fixed cost</button>'+
  '<div class="acts two"><button class="btn p" id="go">Save</button><button class="btn" id="cn">Cancel</button></div>');
  $('cn').onclick=close;
  $('ab').onclick=function(){$('bl').insertAdjacentHTML('beforeend',billRow())};
  $('bl').onclick=function(e){if(e.target.tagName==='BUTTON')e.target.parentNode.remove()};
  $('go').onclick=function(){
    var b=parseFloat($('bg').value),a=$('s1').value,z=$('s2').value;
    if(!(b>0)){$('bg').focus();return}
    if(!a||!z||dn(z)<dn(a)){alert('The end date must be on or after the start date.');return}
    S.bills=[].slice.call($('bl').children).map(function(r){var i=r.querySelectorAll('input');return{id:uid(),name:i[0].value.trim()||'Fixed cost',amt:parseFloat(i[1].value)||0,day:Math.min(31,Math.max(1,parseInt(i[2].value)||1))}}).filter(function(x){return x.amt>0});
    S.budget=b;S.start=a;S.end=z;save();close();render();
  };
}

function moveModal(){
  var v=Math.floor(calc().vault);
  open('<h3>Move to spending</h3><p>Adds money from Surplus Savings to today\'s limit. Anything you don\'t spend returns to savings.</p><label for="a">Amount (max '+fmt(v)+')</label><input class="amt mo" id="a" type="number" inputmode="decimal" min="0" max="'+v+'" value="'+Math.min(v,CAP)+'"><div class="acts two"><button class="btn p" id="sv">Move</button><button class="btn" id="cn">Cancel</button></div>');
  $('cn').onclick=close;
  $('sv').onclick=function(){var a=parseFloat($('a').value);if(!(a>0)||a>v+.5){$('a').focus();return}S.tr.push({id:uid(),a:Math.min(a,v),d:today()});save();close();render()};
}

/* Sync + backup */
function enc(){return'DSB2:'+btoa(unescape(encodeURIComponent(JSON.stringify(S))))}
function dec(t){
  t=t.replace(/\s+/g,'');if(t.indexOf('DSB2:')!==0)throw 0;
  var o=JSON.parse(decodeURIComponent(escape(atob(t.slice(5)))));
  if(typeof o.budget!=='number'||!Array.isArray(o.exp))throw 0;return norm(o);
}
function copyTxt(t){
  if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t);
  return new Promise(function(ok,no){var x=document.createElement('textarea');x.value=t;x.style.cssText='position:fixed;opacity:0';document.body.appendChild(x);x.select();try{document.execCommand('copy')?ok():no()}catch(e){no()}x.remove()});
}
function syncModal(){
  open('<h3>Backup &amp; sync</h3><p>Move your data between phone and PC without a server.</p>'+
  '<button class="btn p" id="cp" style="width:100%;margin-top:14px">Copy sync code</button><p id="ss" style="margin-top:6px"></p>'+
  '<div class="sec"><label for="pc">Paste a sync code from your other device</label><textarea id="pc" placeholder="DSB2:…"></textarea><div class="acts two"><button class="btn sm p" id="mg">Merge</button><button class="btn sm" id="rp">Replace all</button></div><p style="margin-top:6px">Merge adds missing entries and takes the newer budget settings. Replace overwrites this device.</p></div>'+
  '<div class="sec"><div class="acts two"><button class="btn sm" id="ex">Export .json</button><button class="btn sm" id="im">Import .json</button></div></div><div class="acts"><button class="btn" id="cn">Close</button></div>');
  var say=function(t,bad){var s=$('ss');s.textContent=t;s.className=bad?'neg':''};
  $('cn').onclick=close;
  $('cp').onclick=function(){copyTxt(enc()).then(function(){say('Copied. Paste it into Telegram, WhatsApp or Notes.')},function(){$('pc').value=enc();say('Copy was blocked. Code placed in the box below: select all and copy.',1)})};
  var apply=function(mode){
    var m;try{m=dec($('pc').value)}catch(e){say('That is not a valid sync code.',1);return}
    if(mode==='r'){if(!confirm('Replace all data on this device?'))return;m.theme=S.theme;S=m;save(1)}
    else{
      var ids={};S.exp.forEach(function(x){ids[x.id]=1});m.exp.forEach(function(x){if(!ids[x.id])S.exp.push(x)});
      var ti={};S.tr.forEach(function(x){ti[x.id]=1});m.tr.forEach(function(x){if(!ti[x.id])S.tr.push(x)});
      if((m.u||0)>(S.u||0)){S.budget=m.budget;S.bills=m.bills;S.start=m.start;S.end=m.end;S.u=m.u}
      save(1);
    }
    window._f=1;close();render();
  };
  $('mg').onclick=function(){apply('m')};$('rp').onclick=function(){apply('r')};
  $('pc').addEventListener('paste',function(){setTimeout(function(){try{var m=dec($('pc').value);say('Code is valid: '+m.exp.length+' entries. Choose Merge or Replace.')}catch(e){say('That is not a valid sync code.',1)}},30)});
  $('ex').onclick=function(){
    var u=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'})),a=document.createElement('a');
    a.href=u;a.download='dailysafe-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},2000);
  };
  $('im').onclick=function(){$('imp').click()};
}
$('imp').addEventListener('change',function(){
  var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{
    var d=JSON.parse(r.result);if(typeof d.budget!=='number'||!Array.isArray(d.exp))throw 0;
    if(!confirm('Replace current data with this backup?'))return;
    d=norm(d);d.theme=S.theme;S=d;save(1);window._f=1;close();render();
  }catch(e){alert('That file is not a valid DailySafe backup.')}};
  r.readAsText(f);this.value='';
});

$('add').onclick=function(){expModal()};
$('app').addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.dataset.a==='ed')return expModal(t.dataset.id);
  if(t.dataset.a==='rm')return rm(t.dataset.id);
  switch(t.id){
    case'th':S.theme=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';save(1);theme();break;
    case'sy':syncModal();break;
    case'mv':moveModal();break;
    case'eb':settings(false);break;
    case'nc':settings(false,true);break;
    case'cl':if(confirm('Delete ALL logged expenses? Budget and fixed costs stay.')){S.exp=[];S.tr=[];save();render()}break;
  }
});

/* PWA manifest built at runtime so the app stays one file */
try{
  var cv=document.createElement('canvas'),ic=[];
  [192,512].forEach(function(s){cv.width=cv.height=s;var x=cv.getContext('2d');
    x.fillStyle='#000';x.fillRect(0,0,s,s);x.fillStyle='#f4f4f4';
    for(var i=0;i<5;i++)for(var j=0;j<5;j++){x.beginPath();x.arc(s*(.26+.12*i),s*(.26+.12*j),s*.03,0,7);x.fill()}
    x.fillStyle='#d71921';x.beginPath();x.arc(s*.5,s*.5,s*.07,0,7);x.fill();
    ic.push({src:cv.toDataURL('image/png'),sizes:s+'x'+s,type:'image/png',purpose:'any maskable'})});
  var mf={name:'DailySafe Budget',short_name:'DailySafe',start_url:location.href.split('#')[0],scope:location.href.replace(/[^\/]*$/,''),display:'standalone',background_color:'#000000',theme_color:'#000000',icons:ic};
  var l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/manifest+json'}));document.head.appendChild(l);
}catch(e){}
/* Service worker must be a real file (browsers block inline/blob workers) */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(function(r){r.update()}).catch(function(){});
}
render();
})();
</script>
