<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e5c4d">
<meta name="mobile-web-app-capable" content="yes">
<title>DailySafe Budget</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e5c4d'/%3E%3Ccircle cx='32' cy='32' r='16' fill='%23e8a317'/%3E%3C/svg%3E">
<style>
:root{--bg:#f4f5ef;--card:#fff;--tx:#12201c;--mu:#5d6b66;--bd:#dfe3da;--ac:#0e5c4d;--ac2:#e8a317;--ok:#1f9d6b;--wn:#d98a00;--bad:#c93c3c;--on:#fff;color-scheme:light}
[data-theme=dark]{--bg:#0b1411;--card:#13211c;--tx:#eef3f0;--mu:#93a39c;--bd:#22342d;--ac:#3ecf9e;--ac2:#f0b83a;--ok:#3ecf9e;--wn:#f0b83a;--bad:#ff7070;--on:#06130e;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(104px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:12px 16px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.top{display:flex;justify-content:space-between;align-items:center;padding:4px 0 12px}
.top b{font-size:18px;letter-spacing:.2px}
.ib{min-width:48px;height:48px;border-radius:14px;background:var(--card);border:1px solid var(--bd);font-size:20px}
.hero{background:var(--ac);color:var(--on);border-radius:24px;padding:22px 20px}
.hero small{opacity:.85;font-size:14px;font-weight:600}
.big{font-size:clamp(44px,15vw,68px);font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;margin:6px 0 14px;word-break:break-all}
.bar{height:18px;border-radius:9px;background:rgba(255,255,255,.28);overflow:hidden}
[data-theme=dark] .bar{background:rgba(0,0,0,.3)}
.bar i{display:block;height:100%;width:0;border-radius:9px;background:var(--ac2);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar i.w{background:#fff3c4}.bar i.o{background:#ff8a80}
.row{display:flex;justify-content:space-between;margin-top:10px;font-size:15px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.st{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px}
.st.w{grid-column:span 2}
.st small,.mu{color:var(--mu);font-size:13px}
.st b{display:block;font-size:24px;font-variant-numeric:tabular-nums;margin-top:2px}
h2{font-size:15px;margin:18px 0 8px;color:var(--mu);font-weight:700}
.li{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:13px 14px;margin-bottom:8px;min-height:54px}
.li span{display:block}.li b{font-variant-numeric:tabular-nums}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn{min-height:52px;border-radius:14px;background:var(--card);border:1px solid var(--bd);font-weight:600;padding:0 12px}
.btn.p{background:var(--ac);color:var(--on);border-color:var(--ac)}
.btn.d{color:var(--bad)}
.fab{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));max-width:528px;margin:auto;height:64px;border-radius:20px;background:var(--ac2);color:#1a1200;font-size:20px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.fab:active,.btn:active{transform:scale(.98)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font-size:20px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px;font-weight:600}
input,select{width:100%;height:54px;border-radius:14px;border:1px solid var(--bd);background:var(--card);padding:0 14px;font-size:18px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--ac2);outline-offset:1px}
.amt{font-size:34px;height:70px;font-weight:700}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chips input{display:none}
.chips label{margin:0;text-align:center;padding:14px 4px;border-radius:14px;background:var(--card);border:1px solid var(--bd);color:var(--tx);font-size:15px}
.chips input:checked+label{background:var(--ac);color:var(--on);border-color:var(--ac)}
.br{display:grid;grid-template-columns:2fr 1.3fr .8fr;gap:6px;margin-bottom:6px}
.br input{height:48px;font-size:15px;padding:0 8px}
.acts{display:grid;gap:8px;margin-top:16px}
.acts.two{grid-template-columns:1fr 1fr}
.empty{color:var(--mu);text-align:center;padding:18px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<button class="fab" id="add">+ Add Expense</button>
<div class="modal" id="m"><div class="sheet" id="mb"></div></div>
<input type="file" id="imp" accept="application/json,.json" hidden>

<script>
(function(){
'use strict';
var K='dailysafe.v1',CATS=['Food','Transport','Bills','Health','Shopping','Misc'];
var $=function(i){return document.getElementById(i)};
var pad=function(n){return n<10?'0'+n:''+n};
var ymd=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var S;
function fresh(){return{cur:'৳',budget:0,bills:[],exp:[],month:ymd(new Date()).slice(0,7),theme:''}}
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||typeof S!=='object')S=fresh();
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('Storage full or blocked. Export your data now.')}}
function fmt(n){var r=Math.round(n);return(r<0?'-':'')+S.cur+Math.abs(r).toLocaleString()}
function theme(){var t=S.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)}

function calc(){
  var d=new Date(),mk=ymd(d).slice(0,7),td=ymd(d);
  var dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),left=dim-d.getDate()+1;
  var bills=S.bills.reduce(function(a,b){return a+(+b.amt||0)},0);
  var pool=S.budget-bills,spent=0,today=0;
  S.exp.forEach(function(e){if(e.d.slice(0,7)===mk){spent+=e.a;if(e.d===td)today+=e.a}});
  var rem=pool-spent,limit=(rem+today)/left;
  return{td:td,left:left,bills:bills,pool:pool,rem:rem,today:today,limit:limit,
    todayLeft:limit-today,tmr:left>1?rem/(left-1):null,mk:mk}
}

function render(){
  theme();var c=calc();
  var pct=c.limit>0?Math.min(100,c.today/c.limit*100):(c.today>0?100:0);
  var cls=pct>=100&&c.today>c.limit?'o':(pct>=75?'w':'');
  var over=c.todayLeft<0;
  var nb=nextBill();
  var list=S.exp.filter(function(e){return e.d.slice(0,7)===c.mk}).sort(function(a,b){return b.t-a.t}).slice(0,25);
  var h='<div class="top"><b>DailySafe Budget</b><button class="ib" id="th" aria-label="Toggle dark mode">◐</button></div>'+
  '<section class="hero"><small>TODAY\'S SAFE SPEND LIMIT</small><div class="big">'+fmt(Math.max(c.limit,0))+'</div>'+
  '<div class="bar"><i class="'+cls+'" style="width:'+pct+'%"></i></div>'+
  '<div class="row"><span>Spent '+fmt(c.today)+'</span><span>'+(over?'Over by '+fmt(-c.todayLeft):fmt(c.todayLeft)+' left')+'</span></div></section>'+
  '<div class="grid"><div class="st w"><small>Total remaining balance</small><b style="color:'+(c.rem<0?'var(--bad)':'inherit')+'">'+fmt(c.rem)+'</b></div>'+
  '<div class="st"><small>Days left</small><b>'+c.left+'</b></div>'+
  '<div class="st"><small>Unallocated budget</small><b>'+fmt(c.pool)+'</b></div>'+
  '<div class="st w"><small>Tomorrow\'s limit</small><b>'+(c.tmr===null?'Last day':fmt(Math.max(c.tmr,0)))+'</b>'+
  (nb?'<small>Next bill: '+esc(nb.name)+' on the '+nb.day+' ('+fmt(nb.amt)+')</small>':'')+'</div></div>'+
  '<h2>This month\'s log</h2>';
  if(!list.length)h+='<div class="empty">No expenses yet. Tap “Add Expense” to start.</div>';
  list.forEach(function(e){h+='<button class="li" data-e="'+e.id+'"><span>'+esc(e.c)+'<small class="mu">'+(e.d===c.td?'Today':e.d.slice(5))+'</small></span><b>'+fmt(e.a)+'</b></button>'});
  h+='<div class="tools"><button class="btn p" id="nm">Start New Month</button><button class="btn" id="ex">Export Data</button><button class="btn" id="im">Import Data</button><button class="btn d" id="cl">Clear Logs</button></div>';
  $('app').innerHTML=h;
  if(S.budget<=0&&!window._shown){window._shown=1;setup(true)}
  else if(S.month!==c.mk&&!window._shown){window._shown=1;setup(true)}
}
function nextBill(){
  var d=new Date().getDate(),b=S.bills.filter(function(x){return x.day>=d}).sort(function(a,b){return a.day-b.day});
  return b[0]||null;
}
function open(html){$('mb').innerHTML=html;$('m').classList.add('on')}
function close(){$('m').classList.remove('on')}
$('m').addEventListener('click',function(e){if(e.target===this)close()});

function expModal(id){
  var e=id?S.exp.filter(function(x){return x.id==id})[0]:null;
  var ch=CATS.map(function(c,i){var on=e?e.c===c:i===0;return'<input type="radio" name="c" id="c'+i+'" value="'+c+'"'+(on?' checked':'')+'><label for="c'+i+'">'+c+'</label>'}).join('');
  open('<h3>'+(e?'Edit expense':'Add expense')+'</h3><label for="a">Amount ('+esc(S.cur)+')</label><input class="amt" id="a" type="number" inputmode="decimal" min="0" step="any" value="'+(e?e.a:'')+'" placeholder="0">'+
  '<label>Category</label><div class="chips">'+ch+'</div><div class="acts'+(e?' two':'')+'"><button class="btn p" id="sv">Save</button>'+(e?'<button class="btn d" id="dl">Delete</button>':'')+'<button class="btn" id="cn" style="'+(e?'grid-column:span 2':'')+'">Cancel</button></div>');
  setTimeout(function(){$('a').focus()},60);
  $('cn').onclick=close;
  $('sv').onclick=function(){
    var a=parseFloat($('a').value);if(!(a>0)){$('a').focus();return}
    var c=document.querySelector('input[name=c]:checked').value;
    if(e){e.a=a;e.c=c}else S.exp.push({id:Date.now(),a:a,c:c,d:ymd(new Date()),t:Date.now()});
    save();close();render();
  };
  if(e)$('dl').onclick=function(){S.exp=S.exp.filter(function(x){return x.id!==e.id});save();close();render()};
}

function billRow(b){b=b||{};return'<div class="br"><input placeholder="Bill name" value="'+esc(b.name||'')+'"><input type="number" inputmode="decimal" placeholder="Amount" value="'+(b.amt||'')+'"><input type="number" inputmode="numeric" min="1" max="31" placeholder="Day" value="'+(b.day||'')+'"></div>'}
function setup(auto){
  open('<h3>Start new month</h3>'+(auto?'<p class="mu">Set your budget for this month. Previous expenses will be cleared—export first if you want a backup.</p>':'<p class="mu">This clears the expense log and sets a new budget.</p>')+
  '<label for="bg">Monthly income / budget</label><input id="bg" type="number" inputmode="decimal" min="0" value="'+(S.budget||'')+'" placeholder="0">'+
  '<label for="cu">Currency symbol</label><input id="cu" maxlength="4" value="'+esc(S.cur)+'">'+
  '<label>Fixed bills (name, amount, due day)</label><div id="bl">'+(S.bills.length?S.bills.map(billRow).join(''):billRow())+'</div>'+
  '<button class="btn" id="ab" style="width:100%">+ Add bill</button><div class="acts two"><button class="btn p" id="go">Start month</button><button class="btn" id="cn">Cancel</button></div>');
  $('cn').onclick=close;
  $('ab').onclick=function(){$('bl').insertAdjacentHTML('beforeend',billRow())};
  $('go').onclick=function(){
    var b=parseFloat($('bg').value);if(!(b>0)){$('bg').focus();return}
    var bills=[].slice.call($('bl').children).map(function(r){var i=r.querySelectorAll('input');return{name:i[0].value.trim()||'Bill',amt:parseFloat(i[1].value)||0,day:Math.min(31,Math.max(1,parseInt(i[2].value)||1))}}).filter(function(x){return x.amt>0});
    S.budget=b;S.cur=$('cu').value.trim()||'৳';S.bills=bills;S.exp=[];S.month=ymd(new Date()).slice(0,7);
    save();close();render();
  };
}

function exportData(){
  var u=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
  var a=document.createElement('a');a.href=u;a.download='dailysafe-'+ymd(new Date())+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},2000);
}
$('imp').addEventListener('change',function(){
  var f=this.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{
    var d=JSON.parse(r.result);
    if(typeof d.budget!=='number'||!Array.isArray(d.exp)||!Array.isArray(d.bills))throw 0;
    if(!confirm('Replace current data with this backup?'))return;
    S=Object.assign(fresh(),d);save();window._shown=1;render();
  }catch(e){alert('That file is not a valid DailySafe backup.')}};
  r.readAsText(f);this.value='';
});

$('add').onclick=function(){expModal()};
$('app').addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;
  if(t.dataset.e)return expModal(t.dataset.e);
  switch(t.id){
    case'th':S.theme=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';save();theme();break;
    case'nm':setup(false);break;
    case'ex':exportData();break;
    case'im':$('imp').click();break;
    case'cl':if(confirm('Delete ALL expense entries this month? Budget and bills stay.')){S.exp=[];save();render()}break;
  }
});

/* PWA: manifest built at runtime so everything stays in one file */
try{
  var cv=document.createElement('canvas'),icons=[];
  [192,512].forEach(function(s){cv.width=cv.height=s;var x=cv.getContext('2d');
    x.fillStyle='#0e5c4d';x.fillRect(0,0,s,s);x.fillStyle='#e8a317';x.beginPath();x.arc(s/2,s/2,s*.28,0,7);x.fill();
    x.fillStyle='#0e5c4d';x.font='bold '+(s*.34)+'px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('D',s/2,s/2+s*.02);
    icons.push({src:cv.toDataURL('image/png'),sizes:s+'x'+s,type:'image/png',purpose:'any maskable'})});
  var mf={name:'DailySafe Budget',short_name:'DailySafe',start_url:location.href.split('#')[0],scope:location.href.replace(/[^\/]*$/,''),display:'standalone',background_color:'#0b1411',theme_color:'#0e5c4d',icons:icons};
  var l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/manifest+json'}));document.head.appendChild(l);
}catch(e){}
/* Service worker: browsers refuse blob/inline workers, so keep sw.js next to this file */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
render();
})();
</script>
</body>
</html>
